<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>ESP32-Control: esquema de conexiones</title>
  <style>
    .card { fill: #ffffff; stroke: #e5e7eb; }
    .t { fill: #111827; }
    .muted { fill: #6b7280; }
    .pinlbl { fill: #e5e7eb; font-size: 12px; font-family: Consolas, Menlo, monospace; }
    .pinused { fill: #facc15; font-weight: 700; }
    .sig { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .gnd { stroke: #374151; stroke-width: 2.5; fill: none; }
    .led { stroke: #dc2626; stroke-width: 2.5; fill: none; }
    .comp { stroke: #111827; stroke-width: 2; fill: none; }
    .lbl { font-size: 14px; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
  </style>

  <rect class="card" x="1" y="1" width="1038" height="618" rx="14"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700">ESP32-Control · esquema de conexiones</text>
  <text class="muted" x="40" y="62" font-size="13">ESP32 DevKit V1 (30 pines) · todos los pulsadores entre GPIO y GND, con pull-up interno (INPUT_PULLUP)</text>

  <!-- Placa -->
  <rect x="40" y="80" width="230" height="480" rx="10" fill="#1b2533"/>
  <rect x="62" y="96" width="140" height="150" rx="4" fill="#9ca3af"/>
  <rect x="72" y="106" width="120" height="96" rx="2" fill="#6b7280"/>
  <text x="132" y="160" text-anchor="middle" font-size="12" fill="#f9fafb" font-weight="700">ESP32-WROOM-32</text>
  <path d="M74 214 h20 v-8 h12 v8 h12 v-8 h12 v8 h12 v-8 h12 v8 h20" stroke="#374151" stroke-width="2" fill="none"/>
  <rect x="125" y="548" width="60" height="26" rx="4" fill="#9ca3af"/>
  <text x="155" y="592" text-anchor="middle" class="sub">USB</text>
  <circle cx="90" cy="500" r="9" fill="#374151"/><text x="90" y="526" text-anchor="middle" font-size="10" fill="#9ca3af">EN</text>
  <circle cx="220" cy="500" r="9" fill="#374151"/><text x="220" y="526" text-anchor="middle" font-size="10" fill="#9ca3af">BOOT</text>
  <circle cx="155" cy="300" r="5" fill="#3b82f6"/><text x="155" y="322" text-anchor="middle" font-size="10" fill="#9ca3af">LED GPIO2</text>

  <!-- Header derecho: D23 D22 TX0 RX0 D21 D19 D18 D5 TX2 RX2 D4 D2 D15 GND 3V3 -->
  <g>
    <text class="pinlbl pinused" x="246" y="124" text-anchor="end">D23</text><circle cx="258" cy="120" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="152" text-anchor="end">D22</text><circle cx="258" cy="148" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="180" text-anchor="end">TX0</text><circle cx="258" cy="176" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="208" text-anchor="end">RX0</text><circle cx="258" cy="204" r="5" fill="#6b7280"/>
    <text class="pinlbl pinused" x="246" y="236" text-anchor="end">D21</text><circle cx="258" cy="232" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="264" text-anchor="end">D19</text><circle cx="258" cy="260" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="292" text-anchor="end">D18</text><circle cx="258" cy="288" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="320" text-anchor="end">D5</text><circle cx="258" cy="316" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="348" text-anchor="end">TX2</text><circle cx="258" cy="344" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="376" text-anchor="end">RX2</text><circle cx="258" cy="372" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="404" text-anchor="end">D4</text><circle cx="258" cy="400" r="5" fill="#6b7280"/>
    <text class="pinlbl pinused" x="246" y="432" text-anchor="end">D2</text><circle cx="258" cy="428" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="460" text-anchor="end">D15</text><circle cx="258" cy="456" r="5" fill="#6b7280"/>
    <text class="pinlbl pinused" x="246" y="488" text-anchor="end">GND</text><circle cx="258" cy="484" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="516" text-anchor="end">3V3</text><circle cx="258" cy="512" r="5" fill="#6b7280"/>
  </g>

  <!-- Cables de señal: pin → (codo) → pulsador -->
  <path class="sig" d="M263 120 H540"/>
  <path class="sig" d="M263 148 H420 V180 H540"/>
  <path class="sig" d="M263 232 H400 V240 H540"/>
  <path class="sig" d="M263 260 H380 V300 H540"/>
  <path class="sig" d="M263 288 H360 V360 H540"/>

  <!-- Pulsadores (contactos en x=548 y x=596) -->
  <g id="pulsadores">
    <g transform="translate(0,120)"><circle class="comp" cx="548" cy="0" r="3.5"/><circle class="comp" cx="596" cy="0" r="3.5"/><path class="comp" d="M540 -12 H604 M572 -12 V-22 M562 -22 H582"/></g>
    <g transform="translate(0,180)"><circle class="comp" cx="548" cy="0" r="3.5"/><circle class="comp" cx="596" cy="0" r="3.5"/><path class="comp" d="M540 -12 H604 M572 -12 V-22 M562 -22 H582"/></g>
    <g transform="translate(0,240)"><circle class="comp" cx="548" cy="0" r="3.5"/><circle class="comp" cx="596" cy="0" r="3.5"/><path class="comp" d="M540 -12 H604 M572 -12 V-22 M562 -22 H582"/></g>
    <g transform="translate(0,300)"><circle class="comp" cx="548" cy="0" r="3.5"/><circle class="comp" cx="596" cy="0" r="3.5"/><path class="comp" d="M540 -12 H604 M572 -12 V-22 M562 -22 H582"/></g>
    <g transform="translate(0,360)"><circle class="comp" cx="548" cy="0" r="3.5"/><circle class="comp" cx="596" cy="0" r="3.5"/><path class="comp" d="M540 -12 H604 M572 -12 V-22 M562 -22 H582"/></g>
  </g>

  <!-- Del pulsador al bus de GND -->
  <path class="gnd" d="M600 120 H760 M600 180 H760 M600 240 H760 M600 300 H760 M600 360 H760"/>

  <!-- LED de estado: D2 → 330 Ω → LED → GND -->
  <path class="led" d="M263 428 H430"/>
  <path class="comp" d="M430 428 l6 -9 l12 18 l12 -18 l12 18 l12 -18 l12 18 l6 -9"/>
  <text class="sub" x="466" y="410" text-anchor="middle">330 Ω</text>
  <path class="led" d="M502 428 H560"/>
  <path d="M560 414 L560 442 L584 428 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <path d="M584 414 V442" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M574 410 l8 -10 M582 400 l-5 1 M582 400 l-1 5 M584 414 l8 -10 M592 404 l-5 1 M592 404 l-1 5" stroke="#dc2626" stroke-width="1.6" fill="none"/>
  <text class="sub" x="572" y="460" text-anchor="middle">LED</text>
  <path class="gnd" d="M584 428 H760"/>

  <!-- GND de la placa y bus común -->
  <path class="gnd" d="M263 484 H760 V120"/>
  <g fill="#374151">
    <circle cx="760" cy="120" r="4"/><circle cx="760" cy="180" r="4"/><circle cx="760" cy="240" r="4"/>
    <circle cx="760" cy="300" r="4"/><circle cx="760" cy="360" r="4"/><circle cx="760" cy="428" r="4"/>
  </g>
  <text class="sub" x="772" y="500">GND común</text>

  <!-- Etiquetas -->
  <text class="lbl" x="780" y="116" font-weight="700">Configuración</text><text class="sub" x="780" y="133">GPIO23 · 5 s → modo AP</text>
  <text class="lbl" x="780" y="176" font-weight="700">Botón 4</text><text class="sub" x="780" y="193">GPIO22</text>
  <text class="lbl" x="780" y="236" font-weight="700">Botón 3</text><text class="sub" x="780" y="253">GPIO21</text>
  <text class="lbl" x="780" y="296" font-weight="700">Botón 2</text><text class="sub" x="780" y="313">GPIO19</text>
  <text class="lbl" x="780" y="356" font-weight="700">Botón 1</text><text class="sub" x="780" y="373">GPIO18</text>
  <text class="lbl" x="780" y="424" font-weight="700">LED de estado</text><text class="sub" x="780" y="441">GPIO2 · ya integrado en DevKit V1</text>

  <!-- Notas -->
  <text class="sub" x="300" y="560">• Cables de más de 30 cm o ambiente ruidoso: pull-up externa de 10 kΩ a 3V3 y 100 nF a GND por botón.</text>
  <text class="sub" x="300" y="580">• GPIO2 es pin de arranque: no conecte pull-up externa en él.</text>
  <text class="sub" x="300" y="600">• GPIO21/22 son el I²C por defecto; este firmware no usa I²C.</text>
</svg>
